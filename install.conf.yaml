- defaults:
    link:
      create: true
      relink: true
    shell:
      stdout: true
      stderr: true

- clean: ['~', '~/.config']

# Dotfiles in ~
- link:
    ~/:
      glob: true
      path: home/.*
      force: true

# ~/.config is a real directory. Only the apps listed here are linked, so other
# apps can write their state to ~/.config without touching this repo.
- link:
    ~/.config/agents: config/agents
    ~/.config/atuin: config/atuin
    ~/.config/ghostty: config/ghostty
    ~/.config/husky: config/husky
    ~/.config/lazygit: config/lazygit
    ~/.config/mise: config/mise
    ~/.config/rex: config/rex
    ~/.config/whosthere: config/whosthere
    ~/.config/yazi: config/yazi

- shell:
    - description: Seeding app-owned configs (copied once, never linked)
      command: ./scripts/seed.sh

    - description: Installing submodules
      command: git submodule update --init --recursive

    - description: Installing zgenom
      command: ./scripts/zgenom.sh

    - description: Installing tpm
      command: ./scripts/tpm.sh

    - description: Scaffolding Project folders
      command: ./scripts/projects.sh

    - description: Linking Agents instructions
      command: ./scripts/agents.sh

    - description: Run ./scripts/bootstrap.sh to bootstrap new machine
      command: echo "bash $DOTFILES/scripts/bootstrap.sh"
