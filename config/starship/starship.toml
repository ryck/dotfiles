# Starship prompt config, linked to ~/.config/starship (STARSHIP_CONFIG in .zshrc)
# https://starship.rs/config/
"$schema" = 'https://starship.rs/config-schema.json'


# Right side: how long the last command took (only when over 2s)
right_format = "$cmd_duration"

add_newline = true

# Give slow git commands in big repos time before warning (default 500ms)
command_timeout = 1_000

[cmd_duration]
min_time = 2_000
format = "[$duration]($style)"

[git_metrics]
disabled = false

[golang]
symbol = " "

[nodejs]
symbol = " "

[package]
symbol = "󰏗 "

[python]
symbol = " "

[aws]
disabled = true

[gcloud]
disabled = true
